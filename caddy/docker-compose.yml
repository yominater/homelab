services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./site/:/srv
      - /srv/data/caddy/caddy_data:/data
      - /srv/data/caddy/caddy_config:/config

networks:
        proxy:
                external: true
                name: proxy-net
volumes:
  caddy_data:
  caddy_config:

